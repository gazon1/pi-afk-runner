name: CI

# The package's own gate. It is not the repository's gate suite — this repository is a
# package, not an application — so it is one job that runs everything the package declares:
# the type check, the lint, the format check, Knip, the tests, the build, and jactionlint.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # mise installs the toolchain pinned in mise.toml — Node and the binaries the
      # aggregate gate runs — so CI and a developer run the same versions. The action
      # is pinned by commit and the mise binary by version.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.11.0

      # The toolchain cache is mise's; this one is for the packages. Without it every
      # run downloads the whole lockfile again.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      # `npm ci` rather than `npm install`: the lockfile is the record of what was tested,
      # and a gate that installs something else than what was reviewed is not a gate.
      - run: npm ci

      # The same command a developer runs. A step-by-step copy of it drifts.
      - run: ./check.sh

      # The built package is what the command runs, so the gate checks that the
      # build produced the entry points the manifest promises. The manifest is
      # the list: a gate that names them itself is a second list, and the two
      # drift — the first drift was a gate that still asked for the library
      # entry points a command does not have.
      - name: the built package has the entry points its manifest names
        run: |
          set -euo pipefail
          node -e '
            const { existsSync, readFileSync } = require("node:fs");
            const manifest = JSON.parse(readFileSync("package.json", "utf8"));
            const entries = typeof manifest.bin === "string"
              ? [manifest.bin]
              : Object.values(manifest.bin || {});
            for (const entry of entries) {
              if (!existsSync(entry)) {
                throw new Error("the build did not produce " + entry);
              }
            }
          '

      # The published tarball must carry the shipped files: dist, skills, the
      # prune-grammars script and the bin entry. A forgotten file is cheap to
      # catch here and expensive after a release.
      - name: the published tarball contains the shipped files
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const fs = require("node:fs");
            const pack = JSON.parse(fs.readFileSync("/tmp/pack.json", "utf8"));
            const files = (pack[0] && pack[0].files || []).map((f) => f.path);
            for (const required of ["dist/cli.js", "skills", "scripts/prune-grammars.mjs"]) {
              const ok = files.some((f) => f === required || f.startsWith(required + "/"));
              if (!ok) throw new Error("the tarball is missing " + required);
            }
            console.log("tarball ok:", files.length, "files");
          '
