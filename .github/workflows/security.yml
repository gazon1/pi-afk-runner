name: Security

# The checks that depend on data outside the repository: the vulnerability
# database and the secret scan. They run on every pull request and on a
# schedule, because a new advisory or a leaked credential appears without a
# commit on our side.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.11.0

      - name: known vulnerabilities in the lockfile
        run: mise exec -- osv-scanner scan source --lockfile=package-lock.json

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.11.0

      - name: committed secrets, in the history and the tree
        run: mise exec -- betterleaks git . --no-banner
