name: Remove claim label on merge

# The runner never merges: a human merges the pull request it opened, and GitHub
# closes the linked issue through the "Fixes #N" in the body. The claim label
# `agent-in-progress` is not taken off by either of those, so without this
# workflow merged issues keep looking claimed forever.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  issues: write
  pull-requests: read

jobs:
  remove-claim-label:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: take `agent-in-progress` off the issue the pull request fixed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The body is the pull request's own text, so it goes in as a value and
          # not into the script: a body with a quote or a backtick in it is then
          # a string, and not a command.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          numbers=$(printf '%s\n' "$PR_BODY" | grep -oE '(Fixes|Closes|Resolves) #[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
          if [ -z "$numbers" ]; then
            echo "no linked issue in the pull request body"
            exit 0
          fi
          for number in $numbers; do
            echo "removing agent-in-progress from issue #$number"
            gh issue edit "$number" --repo "${{ github.repository }}" --remove-label "agent-in-progress" || true
          done